server {
    listen 80;
    listen [::]:80;
    server_name app.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.midominio.com;

    ssl_certificate /etc/letsencrypt/live/app.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.midominio.com/privkey.pem;

    client_max_body_size 15M;

    location /static/ {
        alias /opt/smri/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/smri/media/;
        access_log off;
        expires 1h;
    }

    # Solo Nginx puede invocar este endpoint. Un 2xx significa que la sesión
    # Django del navegador está autenticada y autoriza el acceso al video.
    location = /_media_auth {
        internal;
        proxy_pass http://unix:/run/smri/gunicorn.sock:/camera/media-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /stream/ {
        auth_request /_media_auth;
        proxy_pass http://127.0.0.1:8889/;
        proxy_redirect / /stream/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://unix:/run/smri/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
